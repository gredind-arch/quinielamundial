<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pajilla Control de Aceite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
            margin-bottom: 20px;
        }
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #0288d1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #1a1a1a;
            font-size: 1.6rem;
        }
        .card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid #edf2f7;
        }
        .card h3 {
            font-size: 0.85rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .card .number {
            font-size: 2.8rem;
            font-weight: 800;
            color: #2d3748;
        }
        /* Alertas de color para Millas Restantes */
        .card .number.alert-orange {
            color: #dd6b20;
        }
        .card .number.alert-red {
            color: #e53e3e;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #4a5568;
            font-weight: 500;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.2s;
        }
        input[type="number"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #3182ce;
            color: #ffffff;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.2);
        }
        .btn-primary:hover {
            background-color: #2b6cb0;
        }
        .btn-danger {
            background-color: #ffffff;
            color: #e53e3e;
            border: 1px solid #fed7d7;
            margin-top: 10px;
        }
        .btn-danger:hover {
            background-color: #fff5f5;
        }
        
        /* Estilos de la Tabla de Historial */
        .history-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
        }
        .history-container h3 {
            font-size: 1.1rem;
            color: #1a1a1a;
            margin-bottom: 14px;
            text-align: center;
        }
        .table-wrapper {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #edf2f7;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
        }
        th {
            background-color: #f8fafc;
            color: #718096;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        td {
            color: #2d3748;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty-history {
            text-align: center;
            color: #a0aec0;
            padding: 20px;
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle">Pajilla Control de Aceite</div>
        <h2>Camión</h2>
        
        <div class="card">
            <h3>Millas Restantes</h3>
            <div id="millasRestantes" class="number">10,000</div>
        </div>

        <div class="card">
            <h3>Acumulado Actual</h3>
            <div id="millasAcumuladas" class="number" style="font-size: 1.8rem; color: #3182ce;">0</div>
        </div>

        <div class="form-group">
            <label for="inputMillas">Millas recorridas hoy:</label>
            <input type="number" id="inputMillas" placeholder="Ej. 450" inputmode="numeric">
        </div>

        <button class="btn-primary" onclick="registrarMillas()">Registrar Millas</button>
        <button class="btn-danger" onclick="reiniciarContador()">Reiniciar (Cambio Realizado)</button>
    </div>

    <div class="history-container">
        <h3>Historial de Registros</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Millas Recorridas</th>
                    </tr>
                </thead>
                <tbody id="historialBody">
                    <!-- Los registros se llenarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'control_aceite_camion_v2';

        let datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { acumuladas: 0, historial: [] };

        function actualizarVista() {
            const META = 10000;
            let restantes = META - datos.acumuladas;
            if (restantes < 0) restantes = 0;

            document.getElementById('millasAcumuladas').innerText = datos.acumuladas.toLocaleString();
            
            const elemRestantes = document.getElementById('millasRestantes');
            elemRestantes.innerText = restantes.toLocaleString();

            // Limpiar clases de alertas anteriores
            elemRestantes.classList.remove('alert-orange', 'alert-red');

            // Reglas de colores solicitadas
            if (restantes <= 200) {
                elemRestantes.classList.add('alert-red');
            } else if (restantes <= 1500) { // Rango anaranjado de aviso previo antes de llegar a las 500
                elemRestantes.classList.add('alert-orange');
            }

            // Actualizar la tabla de historial
            const tbody = document.getElementById('historialBody');
            tbody.innerHTML = '';

            if (datos.historial.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="empty-history">No hay registros guardados aún.</td></tr>`;
            } else {
                // Mostrar del más reciente al más antiguo
                datos.historial.slice().reverse().forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${item.fecha}</td><td><strong>+${item.millas.toLocaleString()}</strong> millas</td>`;
                    tbody.appendChild(tr);
                });
            }
        }

        function registrarMillas() {
            const input = document.getElementById('inputMillas');
            const valor = parseFloat(input.value);

            if (isNaN(valor) || valor <= 0) {
                alert('Por favor, ingresa un número válido de millas.');
                return;
            }

            // Obtener fecha actual formateada localmente
            const fechaActual = new Date().toLocaleDateString('es-ES', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            datos.acumuladas += valor;
            datos.historial.push({ fecha: fechaActual, millas: valor });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
            
            input.value = '';
            actualizarVista();
        }

        function reiniciarContador() {
            if (confirm('¿Estás seguro de reiniciar el contador? Esto indica que ya realizaste el cambio de aceite.')) {
                datos.acumuladas = 0;
                datos.historial = []; // Limpiar también el historial al cambiar de aceite
                localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
                actualizarVista();
            }
        }

        actualizarVista();
    </script>

</body>
</html>
