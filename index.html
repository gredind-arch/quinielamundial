<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial 2026</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
        .error-box { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 15px; margin: 10px; display: none; }
        .loading { color: #d97706; font-weight: bold; }
    </style>
</head>
<body>

<div id="status" class="loading">⏳ Conectando al servidor...</div>
<div id="error-db" class="error-box"></div>

<script>
    // USANDO TU CLAVE VERIFICADA
    const ENDPOINT_NUBE = "https://kvdb.io/M7g1jxKHWEg4HC4Jy9nMs8/datos_quiniela";

    async function testConexion() {
        const status = document.getElementById('status');
        const errDiv = document.getElementById('error-db');
        
        try {
            // Usamos 'no-cache' para evitar que el navegador guarde una versión vieja y rota
            const response = await fetch(ENDPOINT_NUBE, { cache: 'no-store' });
            
            if (!response.ok) {
                throw new Error("Estado HTTP: " + response.status);
            }
            
            status.innerText = "✅ ¡Conexión establecida correctamente!";
            status.style.color = "green";
            
        } catch (error) {
            status.innerText = "❌ Fallo al conectar.";
            errDiv.style.display = "block";
            errDiv.innerText = "Error: " + error.message + ". Intenta recargar la página (F5) o usa otra red Wi-Fi.";
        }
    }

    window.onload = testConexion;
</script>

</body>
</html>
